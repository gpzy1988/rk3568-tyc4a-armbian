name: Build Armbian for TYC4A

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Armbian Firmware
        uses: ophub/amlogic-s9xxx-armbian@main
        with:
          build_target: armbian
          armbian_board: rk3568
          armbian_kernel: 6.1.y
